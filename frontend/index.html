<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="GANGSTERS CLUB — a private members' club. Enter the inner circle."
    />

    <!-- Open Graph / social preview. og:image must be an absolute URL and a
         raster format (PNG/JPG) — drop a 1200x630 file at frontend/public/og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GANGSTERS CLUB" />
    <meta property="og:title" content="GANGSTERS CLUB — Private Members' Club" />
    <meta
      property="og:description"
      content="A private members' club. Membership is by application and approval only."
    />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GANGSTERS CLUB — Private Members' Club" />
    <meta
      name="twitter:description"
      content="A private members' club. Membership is by application and approval only."
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>GANGSTERS CLUB — Private Members' Club</title>
  </head>
  <body class="bg-ink-950 text-silver-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
